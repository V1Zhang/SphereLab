<!doctype html>
<meta charset="utf-8">
<title>SphereLab native 16K tile preview</title>
<style>html,body{margin:0;background:#080a0d;color:#dce3ed;font:14px system-ui}body{display:grid;place-items:center;height:100vh}#tiles{display:grid;grid-template-columns:repeat(4,1fr);width:min(96vw,1600px);aspect-ratio:1;background:#111}canvas{display:block;width:100%;height:100%;image-rendering:auto}#status{position:fixed;top:12px;left:12px}</style>
<div id="status">connecting…</div><div id="tiles"></div>
<script>
const status = document.querySelector('#status'), tileCanvases = [];
for (let i = 0; i < 16; i++) { const canvas = document.createElement('canvas'); canvas.width = 4096; canvas.height = 4096; document.querySelector('#tiles').append(canvas); tileCanvases.push(canvas); }
const pc = new RTCPeerConnection(); const channel = pc.createDataChannel('native-tiles');
const waitForIce = () => pc.iceGatheringState === 'complete' ? Promise.resolve() : new Promise(resolve => {
  const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); resolve(); } };
  pc.addEventListener('icegatheringstatechange', done); setTimeout(resolve, 6000);
});
let pending = null, pendingParts = [], pendingBytes = 0;
channel.binaryType = 'arraybuffer';
channel.onopen = () => status.textContent = 'WebRTC connected · native 16K tile mode';
channel.onmessage = async ({data}) => {
  if (typeof data === 'string') {
    const msg = JSON.parse(data);
    if (msg.type === 'tile') { pending = msg; pendingParts = []; pendingBytes = 0; }
    if (msg.type === 'frame-end') status.textContent = `frame ${msg.frame} received · 16384×16384 native tiles`;
    return;
  }
  if (!pending) return;
  pendingParts.push(new Uint8Array(data)); pendingBytes += data.byteLength;
  if (pendingBytes < pending.bytes) return;
  const blob = new Blob(pendingParts, {type: pending.mime}); const bitmap = await createImageBitmap(blob);
  const canvas = tileCanvases[pending.row * 4 + pending.column]; canvas.getContext('2d').drawImage(bitmap, 0, 0, pending.width, pending.height);
  bitmap.close(); pending = null;
};
(async () => { const offer = await pc.createOffer(); await pc.setLocalDescription(offer); await waitForIce();
  const response = await fetch('/api/render/webrtc', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({offer:pc.localDescription})});
  if (!response.ok) throw new Error(await response.text()); const result = await response.json(); await pc.setRemoteDescription(result.answer);
})().catch(error => { status.textContent = error.message; });
</script>
