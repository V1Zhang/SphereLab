name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux desktop package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Install desktop dependencies
        working-directory: software
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          npm_config_electron_mirror: https://npmmirror.com/mirrors/electron/

      - name: Build desktop package
        working-directory: software
        run: npm run build

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: software/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SphereLab ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
